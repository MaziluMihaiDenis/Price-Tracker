{% if change %}<span class="price-change change-{{ change.direction }}" title="{% if change.direction == 'down' %}Down{% else %}Up{% endif %} since {{ change.since|date:'j M Y' }}, was {{ change.previous.amount|floatformat:2 }} {{ change.previous.currency }}"><span aria-hidden="true">{% if change.direction == 'down' %}↓{% else %}↑{% endif %}</span><span class="visually-hidden">{{ change.direction }}</span> {% if change.percent < 0.1 %}&lt;0.1{% else %}{{ change.percent|floatformat:"-1" }}{% endif %}%</span>{% endif %}{% if lowest %}<span class="lowest-badge">Lowest ever</span>{% endif %}
